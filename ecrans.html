<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Lumières · Écrans du comptoir</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Oxygen+Mono&display=swap">
<style>
  :root { --or: #f0bd6e; --creme: #f5efe5; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b0a09; color: var(--creme); font-family: Montserrat, system-ui, sans-serif; display: grid; align-content: center; gap: 28px; padding: 30px max(16px, env(safe-area-inset-right, 0px)) 30px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { margin: 0; text-align: center; font-size: clamp(18px, 3vw, 30px); font-weight: 900; letter-spacing: .14em; text-transform: uppercase; }
  p { margin: 0; text-align: center; color: #a39a8e; font-size: 14px; }
  .wall { position: relative; padding: 0 2%; }
  .ceiling { height: 26px; background: linear-gradient(#1a140f, #2a2016); border-radius: 4px 4px 0 0; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .screens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 8px 14px; background: #121110; }
  .tvbox { position: relative; aspect-ratio: 16 / 9; background: #000; border: 3px solid #1d1d1f; border-radius: 3px; overflow: hidden; box-shadow: 0 18px 40px -16px #000; }
  .tvbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .links a { color: #1c1208; background: linear-gradient(160deg, #f6e3bd, #d9b679 55%, #b8894a); text-decoration: none; font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding: 12px 18px; border-radius: 999px; }
  .counter { height: 40px; background: linear-gradient(#5c4630, #2e2216); border-radius: 0 0 6px 6px; }
  @media (max-width: 700px) { .screens { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>Écrans du comptoir</h1>
  <p>Les 3 écrans tournent en boucle (1 minute) et changent de scène en même temps.</p>
  <div class="wall">
    <div class="ceiling"></div>
    <div class="screens">
      <div class="tvbox"><iframe src="/ecran.html?n=1" title="Écran 1 : thés glacés et cocktails" loading="eager"></iframe></div>
      <div class="tvbox"><iframe src="/ecran.html?n=2" title="Écran 2 : desserts et brunch" loading="eager"></iframe></div>
      <div class="tvbox"><iframe src="/ecran.html?n=3" title="Écran 3 : boissons chaudes" loading="eager"></iframe></div>
    </div>
    <div class="counter"></div>
  </div>
  <div class="links">
    <a href="/ecran.html?n=1" target="_blank" rel="noopener">Écran 1 · Fraîcheur</a>
    <a href="/ecran.html?n=2" target="_blank" rel="noopener">Écran 2 · Desserts</a>
    <a href="/ecran.html?n=3" target="_blank" rel="noopener">Écran 3 · Boissons chaudes</a>
  </div>
</body>
</html>
